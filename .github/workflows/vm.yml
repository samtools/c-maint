name: VM based workflows

on:
  workflow_call:

jobs:
  # ----------
  FreeBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['htslib', 'samtools', 'bcftools']
        arch:    ['x86_64']
        #arch:    ['x86_64', 'aarch64']

    steps:
      # Do this first as uses: actions always work on the host OS.
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
        with:
          name: tarball-${{ matrix.package }}
          path: .

      - name: Setup VM
        uses: vmactions/freebsd-vm@v1
        with:
          #debug-on-error: true
          #vnc-password: ${{ secrets.VNC_PASSWORD }}
          arch: ${{ matrix.arch }}
          usesh: true
          cpu: 4
          prepare: |
            pkg update
            pkg install -y autoconf automake bash curl bzip2 gmake libdeflate perl5
        
      - name: outside
        run: |
          uname -a
          pwd
          ls -l

      - name: inside
        shell: freebsd {0}
        run: |
          uname -a
          pwd
          ls -l

  
      # Inside VM
      - name: Extract and build
        shell: freebsd {0}
        run: |
          tar xf ${{ matrix.package }}-9.9.tar.bz2
          cd ${{ matrix.package }}-9.9
          ./configure --enable-werror --with-libdeflate --enable-plugins CFLAGS="-g -O3 -fsanitize=address,undefined -DHTS_ALLOW_UNALIGNED=0 -Wno-format-truncation -Wno-format-overflow" CPPFLAGS="-I/usr/local/include"  LDFLAGS="-fsanitize=address,undefined -L/usr/local/lib -Wl,-R/usr/local/lib"
          gmake -j5

      - name: Test
        shell: freebsd {0}
        run: |
          cd ${{ matrix.package }}-9.9
          gmake check

  # ----------
  OpenBSD:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['htslib', 'samtools', 'bcftools']
        arch:    ['x86_64']

    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
        with:
          name: tarball-${{ matrix.package }}
          path: .
  
      - name: Setup VM
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          cpu: 4
          prepare: |
            pkg_add autoconf-2.71p0 automake-1.18.1 bash bzip2 curl gmake libdeflate xz
        
      # Inside VM
      - name: Extract and build
        shell: openbsd {0}
        run: |
          tar xfj ${{ matrix.package }}-9.9.tar.bz2
          cd ${{ matrix.package }}-9.9
          ./configure --with-libdeflate --enable-werror CPPFLAGS="-I/usr/local/include" LDFLAGS="-L/usr/local/lib -Wl,-R/usr/local/lib"
          gmake -j5

      - name: Test
        shell: openbsd {0}
        run: |
          cd ${{ matrix.package }}-9.9
          gmake check

  # ----------
  Solaris:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ['htslib', 'samtools', 'bcftools']
        arch:    ['x86_64']

    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
        with:
          name: tarball-${{ matrix.package }}
          path: .
  
      - name: Setup VM
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4-clang-19"
          usesh: true
          cpu: 4
          prepare: |
            pkg install autoconf automake bash curl bzip2

      # Inside VM
      - name: Extract and build
        shell: solaris {0}
        run: |
          tar xf ${{ matrix.package }}-9.9.tar.bz2
          cd ${{ matrix.package }}-9.9
          # NB: --without-curses is incompatible with --enable-werror
          ./configure CPPFLAGS="-Wno-sign-conversion -Wno-char-subscripts -fno-stack-protector" --without-curses
          gmake -j5

      - name: Test
        shell: solaris {0}
        run: |
          cd ${{ matrix.package }}-9.9
          # Fix a slightly malformed bcftools test
          if [ '${{ matrix.package }}' == 'bcftools' ]; then
              echo === Fixing test/trio-dnm3/test.sh ===
              sed 's/s,fp,-, ; s,tp,o,/s\/fp\/-\/;s\/tp\/o\//' test/trio-dnm3/test.sh > _
              cat _ > test/trio-dnm3/test.sh
              echo === Fixed ===
          fi

          # We need more compliant versions of tr and grep.
          PATH=/usr/xpg4/bin:$PATH
          export PATH
          gmake check
