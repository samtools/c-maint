name: Build containers for other CI tests

on:
  push:
    paths:
      - containers/**
      - .github/workflows/build-containers.yml
  schedule:
    - cron: "0 1 * * 1"

permissions:
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKER_BUILD_SUMMARY: false
  DOCKER_BUILD_RECORD_UPLOAD: false

jobs:
  container_build_and_push:
    if: github.event_name == 'push' || github.repository == 'samtools/c-maint'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: ['alpine', 'archlinux', 'centos', 'rockylinux', 'opensuse']

    steps:
      - name: Log in to GHCR
        # This is docker/login-action@v4
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        # This is docker/setup-buildx-action@v4
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build and export to GHCR
        # This is docker/build-push-action@v7
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          load: true
          provenance: false
          sbom: false
          file: containers/dockerfile-${{ matrix.os }}
          target: buildimg
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.os }}-for-htslib-ci:test

      - name: Test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          file: containers/dockerfile-${{ matrix.os }}
          target: test
          provenance: false
          sbom: false

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          file: containers/dockerfile-${{ matrix.os }}
          push: true
          provenance: false
          sbom: false
          target: buildimg
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.os }}-for-htslib-ci:latest
