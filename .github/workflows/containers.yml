name: Container based workflows

on:
  workflow_call:

jobs:
  Containers:
    # comment out if we're using the cache
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        package: ['htslib', 'samtools', 'bcftools']
        os:      ['alpine', 'archlinux', 'centos', 'rockylinux', 'opensuse']
        include:
          - os:      alpine
            image:   ghcr.io/samtools/alpine-for-htslib-ci:latest
            cflags:  -Wno-sign-conversion
          - os:      archlinux
            image:   ghcr.io/samtools/archlinux-for-htslib-ci:latest
            cflags:  -Wno-sign-conversion -Wno-discarded-qualifiers
          - os:      centos
            image:   ghcr.io/samtools/centos-for-htslib-ci:latest
          - os:      rockylinux
            image:   ghcr.io/samtools/rockylinux-for-htslib-ci:latest
            cflags:  -Wno-sign-conversion
          - os:      opensuse
            image:   ghcr.io/samtools/opensuse-for-htslib-ci:latest
            cflags:  -Wno-discarded-qualifiers

    steps:
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8
        with:
          name: tarball-${{ matrix.package }}
          path: .

      ## Uncomment this when doing multiple CI tests for a faster turnaround
      #- name: Fetch cached tarball
      #  id: tarball-restore
      #  uses: actions/cache/restore@v6
      #  with:
      #    path: |
      #      htslib-9.9.tar.bz2
      #      samtools-9.9.tar.bz2
      #      bcftools-9.9.tar.bz2
      #    key: tarballs
  
      - name: Extract and build
        run: |
          tar xf ${{ matrix.package }}-9.9.tar.bz2
          cd ${{ matrix.package }}-9.9
          ./configure --enable-werror CFLAGS="-g -O3 ${{ matrix.cflags }}"
          #./configure --enable-werror
          make -j5

      - name: Test
        run: |
          cd ${{ matrix.package }}-9.9
          make check
